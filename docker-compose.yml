name: groundwork

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_URL: jdbc:postgresql://postgres:5432/groundwork
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECURITY_ENABLED: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set a random JWT_SIGNING_SECRET of at least 48 characters}
      CONNECTOR_CREDENTIAL_KEY: ${CONNECTOR_CREDENTIAL_KEY:?Set a random connector credential key of at least 48 characters}
      CONNECTOR_CREDENTIAL_KEY_VERSION: ${CONNECTOR_CREDENTIAL_KEY_VERSION:-1}
      CONNECTOR_PREVIOUS_CREDENTIAL_KEY: ${CONNECTOR_PREVIOUS_CREDENTIAL_KEY:-}
      CONNECTOR_PREVIOUS_CREDENTIAL_KEY_VERSION: ${CONNECTOR_PREVIOUS_CREDENTIAL_KEY_VERSION:-0}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set a random GitHub webhook secret}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
      GITHUB_INTEGRATION_ENABLED: ${GITHUB_INTEGRATION_ENABLED:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PKCS8_BASE64: ${GITHUB_APP_PRIVATE_KEY_PKCS8_BASE64:-}
      ATLASSIAN_INTEGRATION_ENABLED: ${ATLASSIAN_INTEGRATION_ENABLED:-false}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
      ATLASSIAN_REDIRECT_URI: ${ATLASSIAN_REDIRECT_URI:-http://localhost:8080/api/integrations/atlassian/oauth/callback}
      EMBEDDING_PROVIDER: gemini
      EMBEDDING_PROTOCOL: openai-compatible
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: 1536
      AI_PROVIDER: gemini
      AI_PROTOCOL: openai-compatible
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set one GEMINI_API_KEY for chat and embeddings}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
      BILLING_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: groundwork
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]

volumes:
  pgdata:
  redisdata:
