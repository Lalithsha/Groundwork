spring:
  application:
    name: groundwork
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/groundwork}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: 8080
  error:
    include-message: never

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  circuitbreaker:
    instances:
      hookshotStatusLookup:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3

groundwork:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  features:
    evidence-platform: ${FEATURE_EVIDENCE_PLATFORM:true}
    github: ${FEATURE_GITHUB:true}
    atlassian: ${FEATURE_ATLASSIAN:true}
    grounded-ai: ${FEATURE_GROUNDED_AI:true}
    release-records: ${FEATURE_RELEASE_RECORDS:true}
  billing:
    enabled: ${BILLING_ENABLED:false}
  security:
    enabled: ${SECURITY_ENABLED:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_DEMO_DATA:false}
  ingestion:
    max-file-bytes: ${MAX_FILE_BYTES:20971520}
    max-pdf-pages: ${MAX_PDF_PAGES:500}
    chunk-target-tokens: ${CHUNK_TARGET_TOKENS:500}
    chunk-overlap-tokens: ${CHUNK_OVERLAP_TOKENS:60}
    poll-delay-ms: ${INGESTION_POLL_DELAY_MS:1000}
    stale-after-seconds: ${INGESTION_STALE_AFTER_SECONDS:300}
  reindex:
    poll-delay-ms: ${REINDEX_POLL_DELAY_MS:2000}
    max-attempts: ${REINDEX_MAX_ATTEMPTS:3}
    stale-after-seconds: ${REINDEX_STALE_AFTER_SECONDS:900}
  embedding:
    provider: ${EMBEDDING_PROVIDER:local}
    base-url: ${EMBEDDING_BASE_URL:${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}}
    api-key: ${EMBEDDING_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:}}}
    model: ${EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
  chat:
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
    api-key: ${GEMINI_API_KEY:${OPENAI_API_KEY:}}
    model: ${AI_MODEL:gemini-1.5-flash}
  ai:
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  connectors:
    credential-key: ${CONNECTOR_CREDENTIAL_KEY:local-development-connector-key-change-me}
    credential-key-version: ${CONNECTOR_CREDENTIAL_KEY_VERSION:1}
    previous-credential-key: ${CONNECTOR_PREVIOUS_CREDENTIAL_KEY:}
    previous-credential-key-version: ${CONNECTOR_PREVIOUS_CREDENTIAL_KEY_VERSION:0}
  integrations:
    poll-delay-ms: ${INTEGRATION_POLL_DELAY_MS:500}
    stale-after-seconds: ${INTEGRATION_STALE_AFTER_SECONDS:300}
    github:
      enabled: ${GITHUB_INTEGRATION_ENABLED:false}
      api-url: ${GITHUB_API_URL:https://api.github.com}
      app-id: ${GITHUB_APP_ID:}
      private-key-pkcs8-base64: ${GITHUB_APP_PRIVATE_KEY_PKCS8_BASE64:}
      webhook-secret: ${GITHUB_WEBHOOK_SECRET:local-github-webhook-secret-change-me}
      max-webhook-bytes: ${GITHUB_MAX_WEBHOOK_BYTES:2097152}
    atlassian:
      enabled: ${ATLASSIAN_INTEGRATION_ENABLED:false}
      api-url: ${ATLASSIAN_API_URL:https://api.atlassian.com}
      authorization-url: ${ATLASSIAN_AUTHORIZATION_URL:https://auth.atlassian.com/authorize}
      token-url: ${ATLASSIAN_TOKEN_URL:https://auth.atlassian.com/oauth/token}
      client-id: ${ATLASSIAN_CLIENT_ID:}
      client-secret: ${ATLASSIAN_CLIENT_SECRET:}
      redirect-uri: ${ATLASSIAN_REDIRECT_URI:http://localhost:8080/api/integrations/atlassian/oauth/callback}
  analysis:
    poll-delay-ms: ${ANALYSIS_POLL_DELAY_MS:750}
    stale-after-seconds: ${ANALYSIS_STALE_AFTER_SECONDS:300}
  hookshot:
    base-url: ${HOOKSHOT_BASE_URL:http://localhost:8000}
  cohere:
    api-key: ${COHERE_API_KEY:}
    model: ${COHERE_MODEL:rerank-english-v3.0}
    base-url: ${COHERE_BASE_URL:https://api.cohere.com/v1/rerank}
    timeout-seconds: ${COHERE_TIMEOUT_SECONDS:5}
  jwt:
    secret: ${JWT_SIGNING_SECRET:supersecretkeyforgroundworkjwttokengeneration12345}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
    issuer: ${JWT_ISSUER:groundwork}
    audience: ${JWT_AUDIENCE:groundwork-api}
