<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groundwork — AI Document & Knowledge Assistant</title>
  <meta name="description" content="Production-grade AI Knowledge Assistant with Hybrid Retrieval, RRF Reranking, and Custom Document Ingestion." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header class="navbar">
      <div class="brand">
        <div class="logo-icon">⚡</div>
        <div class="brand-text">
          <h1>Groundwork</h1>
          <span class="badge">AI Knowledge RAG v1.0</span>
        </div>
      </div>
      <div class="nav-controls">
        <label class="toggle-mode">
          <span>Retrieval Mode:</span>
          <select id="retrievalModeSelect">
            <option value="hybrid_rerank">Hybrid (Vector + FTS + Rerank)</option>
            <option value="naive">Naive (Vector Only)</option>
          </select>
        </label>
        <input type="file" id="fileInput" accept=".txt,.md,.json" style="display: none;" />
        <button id="reindexBtn" class="btn btn-secondary">⚡ Admin Re-index</button>
      </div>
    </header>

    <main class="chat-container" id="chatContainer">
      <!-- Drag and Drop Overlay -->
      <div id="dropZoneOverlay" class="drop-zone-overlay hidden">
        <div class="drop-zone-content">
          <div class="drop-icon">📄</div>
          <h3>Drop your document here</h3>
          <p>Supports .txt, .md, and .json documents</p>
        </div>
      </div>

      <div class="messages" id="messageList">
        <div class="message assistant">
          <div class="avatar">AI</div>
          <div class="bubble">
            Hello! I am your <strong>Groundwork AI Document & Knowledge Assistant</strong>. Use the 📎 paperclip attachment button below or drag & drop any document anywhere into the chat to ask questions!
          </div>
        </div>
      </div>

      <div class="input-panel">
        <form id="chatForm">
          <button type="button" id="attachBtn" class="btn btn-secondary attach-btn" title="Upload & Index Document">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="text" id="userInput" placeholder="Ask any question about your uploaded documents or knowledge base..." required autocomplete="off" />
          <button type="submit" id="sendBtn" class="btn btn-primary">
            <span>Send</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
